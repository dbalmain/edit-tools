# Dotted keys on the value side: `a.b.c = 1` sets a nested value without opening a
# table header. Equivalent to `[a.b]` + `c = 1`, but a distinct spelling a formatter
# must lay out (and must not rewrite).

fruit.name = "banana"
fruit.color = "yellow"
fruit.flavor.taste = "sweet"
fruit.flavor.intensity = 5

app.databases.postgres.host = "localhost"
app.databases.postgres.port = 5432
app.databases.postgres.options.pool_size = 10

a.b.c.d.e = "a long dotted chain reaching a leaf value"
