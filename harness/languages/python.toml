# Python. Schema: docs/onboarding/WORKFLOW.md, "Stage 0".
name = "python"
extensions = [".py"]

grammar = "tree-sitter-python==0.25.0"
grammar_module = "tree_sitter_python"
grammar_symbol = "language"

# Markdown info strings that select this grammar for a fenced region.
injection_aliases = ["python"]

# `-S` / --skip-string-normalization: the linearity invariant forbids rewriting a
# token's text, so quote normalisation is not available to any package. Comparing
# against a black that does it would make files unwinnable by a rule we imposed.
# Byte-identical to the `black.format_str(..., string_normalization=False)` call
# this replaces, checked over the whole corpus at both widths.
reference = "uvx black@25.9.0 -q --line-length {width} --skip-string-normalization -"
reference_version = "black, 25.9.0 (compiled: yes)"
reference_width = "flag"

# 88 is black's default; 60 forces the layout decisions 88 lets a package dodge.
widths = [88, 60]

# The generic default is selected deliberately. `ast.dump` was the original
# override, but the adversarial arm proved it weaker: it accepted quote changes
# (`"POST"` -> `'POST'`) and numeric respellings (`8080` -> `8_080`) that the
# default rejected. This formatter is not allowed to rewrite token text.
gate3 = "default"

# Both entries were established by running black over the corpus, not by reading
# the grammar:
#   - black parenthesises an expression when it wraps it   (7 of 26 runs)
#   - parenthesising an assignment target renames the node (1 of 26 runs)
transparent_wrappers = ["parenthesized_expression"]
equivalent_kinds = [["pattern_list", "tuple_pattern"]]

# Anonymous tokens are compared by default (gate3.py, `_generic`). A separator
# the grammar makes optional is the formatter's to add or drop -- the same
# permission `trail` has in the rule language -- so it is declared here and
# elided from both signatures. Removing a *load-bearing* separator is still
# caught, because gate 3 reparses: it either fails to parse or changes the
# named tree. See FINDINGS.md entry 5.
# black's magic trailing comma: a broken bracket gains a `,` the source did not have.
# black also parenthesises a region it breaks -- the `paren` sanctioned
# mutation. Those brackets are anonymous children here; a bracket that
# changes meaning becomes a named `parenthesized_expression` instead, so
# the named tree still catches one that is not merely layout.
optional_tokens = [",", "(", ")"]

