# TOML. Schema: docs/onboarding/WORKFLOW.md, "Stage 0".
name = "toml"
extensions = [".toml"]

grammar = "tree-sitter-toml==0.7.0"
grammar_module = "tree_sitter_toml"
grammar_symbol = "language"

# taplo searches cwd and every ancestor for `.taplo.toml` / `taplo.toml`, even for
# stdin input. `-o` wins over the config file for the *same* key, so `column_width`
# is safe -- but every formatting option the command line does NOT set is taken
# from whatever config was found: a `.taplo.toml` with `indent_string` and
# `array_trailing_comma` changes the output verbatim. So `--no-auto-config` is
# load-bearing and the reference output would otherwise depend on where on the
# filesystem it was generated. (Reviewer-verified, 2026-08.)
#
# The width knob is `-o column_width=N`, not a `--column-width` flag. Established
# by running the tool, not by reading `--help`.
#
# `--stdin-filepath` is NOT needed for taplo: with `--no-auto-config` there is no
# config whose `include` globs could consult the name, and `taplo fmt` parses TOML
# unconditionally. All 30 committed reference outputs regenerate byte-identically
# without it. It is kept only because it costs nothing; do not copy it into a
# manifest for a reference that has not been shown to need it. (prettier does.)
reference = "nix run nixpkgs#taplo -- fmt --no-auto-config -o column_width={width} --stdin-filepath x.toml -"
reference_version = "taplo 0.10.0"
reference_width = "flag"

# 88 and 60 both honoured: a flat array that fits at 88 breaks one-per-line at 60.
widths = [88, 60]

# No semantic checker stronger than the generic named-node comparison. `tomllib`
# round-trips the *value* but normalises `1_000` -> 1000, `[a.b]` -> `[a][b]`,
# and compares `nan != nan`, so it is weaker than the generic tree comparison in
# exactly the places a formatter could hide a token rewrite. The generic default
# already catches key reordering and every spelling-preserving change; taplo
# preserves spelling, so it passes as-is.
gate3 = "default"

# Both empty to start: add a kind only when the gate rejects correct output and
# names it. taplo moves no parentheses and renames no nodes, so nothing is
# transparent or equivalent yet.
transparent_wrappers = []
equivalent_kinds = []
