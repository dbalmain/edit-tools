# Markdown. Schema: docs/onboarding/WORKFLOW.md, "Stage 0".
name = "markdown"
extensions = [".md"]

# PyPI name matches the orchestrator's tree_sitter_markdown guess after the
# hyphen-to-underscore swap. 0.5.1 is the latest release (confirmed against the
# live index); the injection fixture already pinned this version. Imported as
# tree_sitter_markdown. The module exports language() (block) and
# inline_language() (inline). Fences, info_string and code_fence_content live
# in the block tree, so the host selects language() — the same choice
# docs/injection.md recorded, and the one gen_trees.py's region splice needs.
# inline_language() is not used: the harness has no included-range second pass.
grammar = "tree-sitter-markdown==0.5.1"
grammar_module = "tree_sitter_markdown"
grammar_symbol = "language"

# `markdown` is canonical. `md` is the conventional fence spelling (GitHub
# linguist, prettier's own support-info aliases). `pandoc` is a different
# dialect and is not vouched for. `mdx` is prettier's MDX parser, not this
# grammar.
injection_aliases = ["markdown", "md"]

# prettier infers the parser from the filename, so stdin needs a fake one
# (verified: without --stdin-filepath and without --parser it errors
# "No parser and no file path given"). --parser markdown is an alternative,
# not an extra flag: parser-only, filepath-only, and x.md vs x.markdown are
# byte-identical on dirty input, so --parser is omitted. --no-config is
# load-bearing (below). --print-width honours {width}: established by diffing
# 80 vs 40 on a 27-item JSON fence, not by reading --help. `--prose-wrap
# always` is now the live policy: gate 3's declared `inline` prose equivalence
# accepts soft-whitespace reflow while continuing to compare words, delimiters
# and hard-break events. The package still emits paragraphs verbatim, so the
# resulting agreement gap honestly measures the reflow work that remains.
#
# embeddedLanguageFormatting = "auto" remains the unnamed default that formats
# fence interiors. Prose wrapping is independent of that guest-formatting policy.
# See corpus/reports/markdown/prose-wrap.md for the before/after measurement and
# docs/prose-projection.md for the planned formatter-side implementation.
reference = "npx --yes prettier@3.9.6 --no-config --stdin-filepath x.md --print-width {width} --prose-wrap always"
reference_version = "3.9.6"
reference_width = "flag"

# 80 is prettier's own default, established three ways: `prettier --help` says
# 80; unprompted output matches `--print-width 80` on every probe; and a
# 26-ones JSON array in a fence (78 chars) stays flat unprompted while a
# 27-ones array (81 chars) breaks unprompted and at 80, and stays flat at 81.
# 40 is the narrow width: it is the first round number at which a JSON fence,
# a JS fence, and the same fence nested in a list or blockquote actually
# split. 60 still leaves the 27-ones array flat.
widths = [80, 40]

# The generic default is selected deliberately. Markdown has no data-model
# loader that would preserve fence bodies, emphasis delimiters, list markers
# or table-cell spelling, and the block grammar's named tree already sees
# those. Leave wrappers/equivalences empty until the gate names a kind —
# markdown has no parenthesised-expression node, and parentheses in links
# are structural.
gate3 = "default"

transparent_wrappers = []
equivalent_kinds = []

# Pipe-table cells are padded to a computed column width and the ruler row's
# dashes are drawn to that same width, so both are layout rather than content
# and gate 3 compares them by meaning. Without this the gate rejects prettier's
# own output on `tables.md` -- the same failure black's added parentheses
# produced, and the same remedy: declare the narrowing, per language, by kind.
layout_leaves = ["pipe_table_cell", "pipe_table_delimiter_cell"]

# The block grammar wraps a leading blank run in a leaf section. Prettier
# removes it; only a section with no children and only ASCII layout whitespace
# may disappear. Meaningful sections still participate in the full tree check.
whitespace_nodes = ["section"]

# Prettier's prose policy may move soft line breaks inside an `inline` node.
# Markdown renders those ASCII whitespace runs as word separation, so their
# position and width are layout rather than content. This stops gate 3 catching
# a formatter that changes spaces, tabs or soft line breaks between the same
# prose bytes. It still compares every word and anonymous delimiter token, and
# preserves two-space and backslash hard-break events that the block grammar's
# reparse cannot distinguish on its own.
prose_nodes = ["inline"]

# The block grammar has no extras. HTML comments are `html_block` nodes; they
# remain structurally checked and also feed gate 3's universal comment layer.
comment_kinds = ["html_block"]

# Measurement exclusions forced by the linearity invariant. prettier rewrites
# that no package may match, so each lives in its own file:
#   - `*em*` -> `_em_` (emphasis delimiter)
#   - `*` / `+` list markers -> `-`
#   - `***` / `___` / `* * *` thematic breaks -> `---`
# Quote-style link titles (`'title'` -> `"title"`) are omitted from the
# corpus rather than excluded: they are the same anonymous-token rewrite as
# JS quotes, and the corpus writes double quotes. Ordered `1)` -> `1.` and
# `__strong__` -> `**strong**` are the same class; the corpus writes the
# canonical form.
[incomparable]
"emphasis.md" = "prettier rewrites *emphasis* to _emphasis_ (delimiter token)"
"list_markers.md" = "prettier respells unordered-list markers: * becomes -, and + becomes * so the second list stays a second list"
"thematic.md" = "prettier rewrites ***, ___ and * * * thematic breaks to ---"
"fence_delimiters.md" = "prettier rewrites ~~~ fence delimiters to ```, dropping the author's choice of character and count"

# Host shape. Keep array tables after every root key: TOML keys below
# [[injections]] would belong to that entry, not to the manifest root.
[[injections]]
node = "fenced_code_block"
info = "info_string"
content = "code_fence_content"

# Structure without layout. An `html_block` is spliced with tree-sitter-html so
# the highlighter and an editor can see real HTML structure inside it, but
# `format = false` keeps the region's bytes the host's: the formatter emits the
# original source, byte for byte.
#
# It ships off because turning it on is not safe yet, for two measured reasons.
# prettier does not format html blocks in markdown at all (`<div    class="x">`
# passes through untouched at width 80), so laying them out could only lose
# agreement against the pinned reference. And an unbalanced open tag -- the
# `<div>`/blank line/`</div>` idiom -- parses as a *complete* element under
# tree-sitter-html 0.23.2 whenever it carries an attribute (`<div class="x">`
# is clean; bare `<div>` is an ERROR and refuses), so the ERROR guard in
# harness/injection.py does not catch fragment splitting. Flipping this to
# `true` is the `format_html_blocks` opt-in, and it waits on that answer.
[[injections]]
node = "html_block"
guest = "html"
format = false
