# JSON. Schema: docs/onboarding/WORKFLOW.md, "Stage 0".
name = "json"
extensions = [".json"]

grammar = "tree-sitter-json==0.24.8"
grammar_module = "tree_sitter_json"
grammar_symbol = "language"

# prettier infers the parser from the filename, so stdin needs a fake one.
reference = "npx --yes prettier@3.6.2 --stdin-filepath x.json --print-width {width}"
reference_version = "3.6.2"
reference_width = "flag"

widths = [88, 60]

# Exact file-and-width cases where differing from prettier is a reviewed house-style
# decision. A reason is mandatory, and score.py fails if a declaration goes stale.
intentional_divergences = []

# Ordered `json.loads` catches key reordering, which the generic tree comparison
# would also catch -- but it additionally proves the output is *valid JSON* by a
# parser that is not tree-sitter, which the generic default cannot.
#
# It is blind to comments; `json.loads` rejects them outright and tree-sitter
# accepts them. gate3.py's universal extras check covers that, and the scored
# JSON corpus has no comments. A builder adding a JSON file *with* comments must
# switch this to "default": the override would report a parse failure.
gate3 = "json"
